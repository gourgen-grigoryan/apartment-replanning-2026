name: Նախագծային փաթեթի ստուգում
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Ստուգել սենքերը, մակերեսները, ուղիները և ֆայլերը
        run: python3 tools/verify_release.py
      - name: Վերահաշվարկել դռների, կահույքի և կոյուղու հատումները
        run: python3 tools/check_geometry.py
